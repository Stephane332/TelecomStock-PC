appId: com.telecomstock.pro
productName: TelecomStock Pro
directories:
  output: dist
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: build/icon.ico
  publisherName: TelecomStock
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: TelecomStock Pro
portable:
  artifactName: TelecomStock-Portable.exe
files:
  - electron/**/*
  - backend/**/*
  - public/**/*
  - package.json
extraResources:
  - data/**/*
